# Variante zum Bauen aus dem Quellcode - fuer die lokale Entwicklung oder
# falls die Registry mal nicht erreichbar ist.
#
#   docker compose -f docker/flowbridge/compose.build.yaml up -d --build
#
# Im Normalbetrieb auf der NAS wird compose.yaml verwendet; dort wird nur ein
# fertiges Abbild geholt.

services:
  flowbridge:
    # Build-Kontext ist der Repo-Root, nicht der Ort dieser Datei.
    build: ../..
    image: flowbridge:lokal
    container_name: flowbridge
    restart: unless-stopped

    ports:
      - "8081:8080"

    environment:
      FLOWBRIDGE_CONFIG: /config/config.yaml
      TZ: Europe/Berlin
      # FLOWBRIDGE_PASSWORD: "hier-ein-gutes-passwort"

    volumes:
      # Beim lokalen Testen ein Verzeichnis NEBEN dem Repo verwenden - sonst
      # ueberschreibt der Container die eigene config.yaml der Entwicklung.
      - ./daten:/config

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/auth/state', timeout=5)"
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

    stop_grace_period: 20s
