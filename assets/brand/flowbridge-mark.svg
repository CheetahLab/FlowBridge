<?xml version="1.0" encoding="utf-8"?>
<!--
  FlowBridge – Bildmarke (Protocol Rail in der Kachel).

  Dieselbe Geometrie wie Logo.tsx, aber mit festen Farbwerten statt
  CSS-Variablen: als Favicon und Container-Symbol wird die Datei ausserhalb
  des Dokuments geladen, dort gibt es die Variablen nicht.

  Dunkler Grund, damit sie auf hellen wie dunklen Browser-Tableisten steht.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect x="0" y="0" width="100" height="100" rx="22" fill="#0E1F3A"/>
  <g transform="translate(4.2 50) scale(1.2727)">
    <path d="M17 0H51" stroke="#7DB7FF" stroke-width="5" stroke-linecap="round"/>
    <circle cx="20" cy="0" r="6" fill="#0A6BFF"/>
    <circle cx="34" cy="0" r="6" fill="#7DB7FF"/>
    <circle cx="52" cy="0" r="6" fill="#FF7A00"/>
  </g>
</svg>
